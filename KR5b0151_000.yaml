body:
  text: 洪武七年十一月大明玄教立成齋醮儀範序略神龜龍馬圖書出應於明時九鳳八鸞鳴唱密諧於妙範方寶珠之輝耀至玉局之高呈三十六部藴奧之文極披詳而莫既五千餘言道德之旨與治化以同符自經義隱而失真致科範傳而寖廣百家異戶歷代濫觴唱讃繁則質寶之弗專晝夜多則精誠之必懈考之於禮樂制度既或僣差質之於天地神祇寧無冒瀆喜有聖人之在上庶幾仙道之重新欽遇皇帝陛下潔靜精微髙明博厚綏萬邦見梯航入貢總三教如江漢朝宗昭事上帝之誠郊焉而享懷柔百神之禮感而遂通用斂福於庶民復留神於兩教洪武七年十一月二十三日臣宋宗真趙允中傅同虛鄧仲修周玄真等欽奉聖旨編定道門科儀去繁就簡立成定規進奏臣宗真等性質凡眛學識淺陋不揆率易謹編定儀式緑藁進呈倘經天監出自聖裁行之於幽顯之間有所益利實道門萬世之幸謹列品序儀文于後大明立成玄教齋醮儀建度亡醮三日節次目録第一日發直符灑淨法事召將三獻酒讀關文遣將化財回向揚幡法事白文吟偈諷經回向安監壇監齋法事白文諷經回向敷座演經請經法事如式諷靈寶經生神章救苦經生天經靈前召請呪食諷經回向立寒林所法事吟偈召孤施食諷經化財第二日灑淨法事諷經禮懴或朝天懴或九幽懴或三官懴靈前呪食至晚接待孤魂施食第三日法事淨壇請師降神通意安鎮五方符告符簡關燈召亡沐浴更衣參禮呪食濟孤施斛鍊度傳戒設醮法事獻供祭酒讀疏送神化財滿散建醮一晝夜即次目録發直符揚幡安監壇敷座演經淨壇請師降神通意告符簡關燈召亡沐浴參禮呪食設斛濟孤傳戒送亡化財設醮獻供祭酒讀疏送神化財圓滿建醮一日節次目録發直符安監壇誦經請師降神通意關燈召亡沐浴參禮呪食設食祭孤傳戒設醮獻供祭酒讀疏送神化財滿散大明立成玄教齋醮儀建度亡醮三日節次第一日發直符呪水灑淨洞中玄虛晃朗太無八方威神使我自然靈寶符命普告九天乾羅答那洞罡太玄斬妖縳邪殺鬼萬千中山神呪元始玉文吾誦一遍却鬼延年按行五嶽八海知聞魔王東首侍衛我軒凶穢消散道氣常存召將焚符三獻文伏以範圍天地之道具載齋科昭回雲漢之文合先疏牘將感通於一瞬庶克享於多儀酌仙醖以浮香初筵既秩望玄都而駕景六合非遙酒在清樽謹陳初獻伏以形而上者謂道妙莫能名聖不可知為神禮存敬享既領行持之職將謄啓告之誠望真閫之開張仙凡有間乘飈車而陟降上下無方謹運一枕用陳二獻伏以官天地府萬物道所以尊潤風雨鼓雷霆神無不在赫若仙科之著大哉神化之靈我有緘封神將省覽有煩傳達庶副懇祈庸罄一忱用終三獻讀關遣將化財回向揚幡法事白文伏以太乙慈尊廣布汪洋之澤大千世界咸依救度之仁灑甘露以沾濡敷慶雲而覆燾今者仰遵玄號昭揭華幡赤字垂芒普照昏衢之朗日洪麻釋罪廣施法海之慈航稽首皈依稱揚讃詠呪幡東華妙嚴慈相億千身居長樂安坐金蓮慧光無礙照燭幽泉枯骸朽骨咸得光鮮甘露流潤遍灑空玄拔度沉溺不滯寒淵吟偈祥雲結就此靈幡影落浮空散世間縹眇靈風𦆵一舉含靈俱得脫幽關諷經回向安監壇伏以三界之中位各分於真宰一方之內功必賴於神明况此修齋當嚴翊衛恭惟監壇效職一切威靈儼然威像卓爾神靈秉聰明正直之心司禍福吉凶之柄百神所範庶類咸皈凡有投誠必蒙感應伏望雲旗耀日馭風馬以來臨仙仗騰空屏妖氛而肅靜證明齋事彈壓靈場法衆皈依志心奉請請神法事諷經安監齋伏以道以齋為先當備潔涓之供誠以禮為重尤嚴烹飪之功欲令庖饌以肅清必仗神威而監董伏冀靈遊來格潛施彈壓之威法味精修蔑有紛葩之氣齋功克就祀事圓成法衆皈依志心奉請請神法事諷經敷座演經蓋聞元始一氣化生諸天開明三景是為天根上無復祖惟道為身是知道者不可思議非有為有非無為無應現十方發育萬類如月㴠衆水了然之影相俱圓猶雲斂長天廓爾之虛空無礙真常湛寂恍惚杳冥濟世無方度人無量以今孝士上念亡靈幻形有盡真性常存雖平等本來不越一真之體然染緣纍劫寧無三毒之塵自非觀聽於法音曷可超凌於上界是用演洞玄之妙典于以廓靈寶之慧光珠黍現時再引仙真之勃勃璇璣停處了觀大量之玄玄法衆虔恭請經如法請經法事諷經靈寶度人經生神章經救苦經生天經靈前呪食自然生神章靈書開大有普為諸衆生稱揚祕密呪奉請亡過靈澄心恭稽首以今施法食惟願來歆受奉為靈儀上資雲路往生仙界念靈寶慈慧禮請頌曰稽首明慧虛無尊稽首皈依重玄主栽成天地無得稱悉為衆生作恃怙慈悲五道轉輪回哀救三塗地獄苦皈依東極青玄尊皈依六道慈悲父皈依三清無上尊永離生死長綿綿出有入虛無所待能令枯朽便成仙千劫萬劫難一遇為衆廣説業因緣回骸起死永長存使其形神無變遷散消長夜苦釋惱三塗中華池流真香功德不思議一灑甘露漿如熱得清涼神魂生大羅潤及於一切奉為靈儀上資雲路往生仙界念淨酆都破茫茫酆都中重重金剛山靈寶無量光洞照炎池煩七祖諸幽魂身隨香雲幡定慧青蓮花上生神永安功德金色光微微開幽關華池流真香蓮蓋隨雲浮仙靈誦玄華常居十二樓急持靈寶呪自在天堂遊寒庭多悲苦回首禮玄微女青靈寶符中山神諦書一念升太清默誦觀太無功歸九幽下漸漸生紫虛生魂育魄呪靈芝無根衆妙之源中凝七魄內結三魂二十四真出入無門杳冥之內恍惚原精隨劫存亡逐氣而生外凝混朴內養七真五神植華三台敷榮紫閣素童度魂歸嬰騰雲而升逐霧浮空中有玉真號曰神翁左挾無英右衛白元玄獸遏後丹禽擁前上浮翠蓋下擁金蓮香雲凝空甘露無窮用之無盡尋源弗終三光法氣開重樓呪浩精生法氣氤氲凝天中兩曜共澄徹五緯交相通三光煥巳明寶氣凝三宫仙鄉會九老咽服百骸豐金華照光景身與造化同念道合自然萬劫壽無窮加持法食呪回首仰玄羅合景挹靈芒拘魂制亡魄思審定中央行住禮虛無寢息宴玄房飢餐黃碧花渴飲瓊林漿神精升大羅合體鍊真光復照觀太無常在空中遊玄通泯波際真化靡中期眇眇無終始行者當自知寂寥忘理教應運闡玄微降道不自招要當先所施會歸無二趣隨心自合離普獻法食呪香煙散十方花開蓮子房騫林珍果奈仙真甘露漿自然香厨食瓊液妙難量吾今普供養逍遙上福堂勤修大道法精心感太冥黃華降真氣五臟結胎嬰七祖生天堂兆魂飛上清福利無不遍此食施衆生諷經化財回向立寒林所吟偈符命通溟漠靈幡揚曉風遷神超北府飛舄上南宫志心遍召三塗九夜六道四生有靈無祀男女幽魂惟願乘三寶力三寶慈悲此日今時來臨法會施食接待諷經第二日灑淨法事諷前諸經禮懴舉起敬讃按人各恭敬三皈依志心皈依十方三寶當願亡靈起心回向一切信禮敷坐讃道場衆等執簡當心禮懴如法念懴或朝天懴或九幽懴或三官懴靈前呪食如前至晚接孤施食吟偈焚符大有通玄戶鬱單降神霄黃雲凝靈府隂陽氣象交志心遍召三塗九夜六道四生士農工啇文武醫卜千行萬類百家九流有靈無祀男女幽魂惟願乘三寶力三寶慈悲此夜今時來臨法會呪斛諷經第三日法事呪水淨壇請師降神通意安鎮五方真符告符簡關燈召亡沐浴更衣參禮呪食回向濟孤施斛靈寶設斛科稱揚太一救苦慈尊焚符灑淨清淨道德之香無逺弗屆太虛寥廓之際有感必通以今建齋某開建法筵普資幽爽恭望慈光下垂開度九幽滯爽咸蒙解脫之功六道靈魂悉遂逍遙之果法衆皈依稱揚功德稱太一救苦慈尊伏聞一氣盈虛萬形出沒死復生而生復死人為鬼而鬼為人輪轉無窮報償不息悲莫悲於六道苦猶苦於四生蓋乏善者難陟善階積惡者斯歸惡道賴我玄祖拯汝沉淪廣敷濟拔之科大啓超升之會當隂慘陽舒之際乃神交鬼聚之時魂氣動而悲風生靈響發而隂霧靄洪音一舉黑壤遙聞仰惟紫極玄尊青華教父指明星為慧烥廣運照臨凝梵氣作法橋大垂拯濟追魂使者告召十方所屬地祇招延催促當願天仙道神祇道人倫道地獄道餓鬼道旁生道孳生物命魚鱉昆蟲不瞬息間遍髙深而普告由斯須頃周遐邇以咸知自然意感誠孚翕爾影隨響答呼群率衆聲相應氣相求出死入生眇能視跛能履無遮無礙源源而來或後或先徐徐而至使者運招徠之力魂兮承攝召之功所有開業道靈音謹當吟詠誦酆都呪焚召魂符稱太一救苦慈尊召孤吟偈太微回黃旗無英命靈幡攝召長夜府開度受生魂志心遍召九州分野十類河沙雷馘天誅虎狼傷啖刀兵屠戮産死陳亡有靈無祀男女幽魂惟願乘三寶力三寶慈悲此夜今時來臨法會志心遍召投河落井洪水漂流劫火焚燒飢荒流蕩瘟災時疫自縊刎亡有靈無祀男女幽魂惟願乘三寶力三寶慈悲此夜今時來臨法會志心遍召盡十方空界遍郊野中客死之魂橫亡之鬼枯骸朽骨男女幽魂惟願承三寶力三寶慈悲此夜今時來臨法會沐浴念呪焚冥衣焚解𡨚釋結符加持斛食五厨經一氣和泰和得一道皆泰和乃無一和玄理同玄際不以意思意亦不求無思意而不復思是法如是持莫將心緣心還莫住絶緣心在莫存心真則守真淵修離志離志積修不符離志而不修志己業無巳知諸食氣結氣非諸久定結氣歸諸本氣隨取當隨泄散施斛食念太一救苦慈尊於此行煉度符法傳戒道言戒者止也所以止人非心歸於正定故戒生定儒者亦謂知止而後有定但三洞衆經四輔祕典演説戒法種種不同惟無上洞玄靈寶九真妙戒者諸戒之首天人共仰幽顯咸遵無上之上洞玄中玄萬神之靈一氣之寶妙貫三才戒制六情數定於陽故分為九修而不偽故名為真仙凡仰之以為城郭幽顯資之以為梯航靈魂受之以為法藥然受戒之法靜默為先持戒之法勤拳為上法衆皈依同誠讃詠按人各恭敬夫三皈依者即是皈依道皈依經皈依師也是故衆魂皆當信禮三皈依皈依既畢戒法將傳幽壤豁若春回𡨚對渙然冰釋罪花凋落功果圓成法衆皈依當傳九戒第一戒者克勤忠於君主第二戒者敬讓孝養父母第三戒者不殺慈救衆生第四戒者不淫正身處物第五戒者不盜推義損已第六戒者不嗔凶怒凌人第七戒者不詐諂賊害善第八戒者不驕傲忽至具第九戒者不二奉戒專一妙戒靈文黃籙白簡既備敷於妙典當敬受於靈文夫心焉難制制以九戒則可歸心於太虛形也未超超以二符自可錬形於上境亡靈直須生生勿忘於戒言劫劫常持於符劵澄神物外塵緣永斷於多生受質陽間善果自臻於有水流芳見在慶及無窮稽首慈尊辭筵好去讀符牒疏送亡化財回向資度設醮三獻科諷呪稱職位具法位某與臨壇法衆等謹同誠上啓虛無自然無極大道太上老君青玄救苦慈尊三十六部尊經玄中大法師祖師正一靜應真君祖玄真師經籍度師列位真人玄壇應感一切威靈伏聞雲官法界上瞻東極之光風澤洞虛下接北隂之境考對莫逃於憲網攝提特啓於玄科憑丹簡以出幽遷神破妄資玉眸而煉質混景成真慈尊之願力宏深仙聖之仁心顯著屬建修之應感隨生化以逍遙紫府清都方罄仰瞻之志潢汙行潦俯殫報效之誠仰冀飈羽清塵雲車泛景應物隨機而顯現月印千江排空馭氣以飛翔煙飄八極旁流慈貺鑒享恭虔謹運丹用陳初獻初獻法事伏聞無極無窮莫測虛玄之妙方生方死亦猶夜旦之常特迷悟之有殊致升沉之各異念黑鬱銅關之苦趣或墮拘留瞻青玄蓮座之慈光所祈濟度爰遵依於仙範沐濯煉於形魂超凌生化之無違報效獻陳之敢後蠟臺燈蘂祥開九色之輝醮席松花誠感衆真之會蹌蹌濟濟肅肅雍雍再運丹衷謹陳亞獻亞獻法事伏聞冥慧洞清經教之流傳不息逍遙快樂神魂之超化有歸拯幽顯以昭蘇秉精誠而激切恩波穆穆感霑被以深隆明水拳拳愧獻陳之菲薄當願所薦亡魂頔除業報永斷執緣水月光中自悟本來之性人天界上託生福慧之身今孝士某悃忱感格行願滿圓三災八難以潛消常居吉慶百順千祥之並集動履光華爰罄一忱酒陳終獻三獻法事讀疏送神伏以道無棄物沐濟拔以不違禮有節文幸醮陳之克滿湛湛杯香之巳注沉沉漏箭以頻催埃塵特愧於凡蒙飈羽豈能於欵駐雲霄景象實不盡於攀瞻宇宙玄恩尚永依於覆護某等無任攀戀之至謹再拜奉送化財滿散大明玄教立成齋醮儀範終
