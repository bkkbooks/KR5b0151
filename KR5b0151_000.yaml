front:
  text: 御製玄教齋醮儀文序一一朕觀釋道乏教各有二徒僧有禪有教道有正一有全真禪與全真務以修身養性獨為自己而巳教與正一專以超脫特為孝子慈親之設益人倫厚風俗其功大矣哉雖孔子之教明國家之法嚴旌有德而責不善則尚有不聽者縱有聽者行不合理又多少其釋道兩家絶無繩愆紏繆之為世人從而不異者甚廣官民之家若有喪事非僧非道難以殯送若不用此二家殯送則父母為子孫者是為不慈子為父母是為不孝恥見鄰里此所以孔子云西方有大聖人不教而治即此是也今之教僧教道非理妄為廣設科儀於理且不通人情不近其愚民無知者妄從科儀是有三五七曰夜諷誦經文經乃釋道化人為善戒人為惡之言猶國家之有律令若誦經而使鬼魂聽之以發揮其善念則可若誦經而欲為死者免罪如犯刑憲而讀律令欲免其罪是為不可蓋糜費家資僧道蠢蠢之徒將以為儀範之美致使精神疲倦觀其儀範之設於中文訛字否達者遂譏毀之所以譏毀者佛未請三清未至輒便望壁啓聞齋主之事僧甚至日三遍對佛宣揚道乃日三朝而敷奏以此觀之釋迦與老子非重聽而瞽目故煩之於再三若不如此果何理耶勑禮部會僧道定擬釋道科儀格式遍行諸處使釋道遵守庶不糜費貧民亦全僧道之精靈豈不美哉
